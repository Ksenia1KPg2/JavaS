     <textarea cols="90" rows="24"> 
       <html> 
 <head> 
  <meta charset="UTF-8"> 
  <link rel="stylesheet" href="styl.css"> 
 </head> 
<body> 
 <script type="text/javascript"> 
  function pole_kurowska() 
   { 
 var a_kur= parseFloat(document.getElementById('dlugosc').value); 
 var b_kur= a_kur*a_kur; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_kur.toFixed(2)+" cm^2";  
   } 
  function obwod_kurowska() 
   { 
 var a_kur= parseFloat(document.getElementById('dlugosc').value); 
 var b_kur= 4*a_kur; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_kur.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_kurowska()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_kurowska()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body> 
</html>
