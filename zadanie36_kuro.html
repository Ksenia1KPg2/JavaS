<!DOCTYPE html>  
<html lang="pl-PL">  
    <meta charset="UTF-8">
    <title>Z36 Kurowska </title> 
     <body> 
 <div style="color:red;font-size:50px;"> 
    <script language="JavaScript"> 
  var x=prompt("podaj liczbę x=",""); 
                var a_dana_kur=parseFloat(x); 
                document.write("wczytana liczba x="+a_dana_kur+"<br>");     
                if(a_dana_kur%2==0) 
                      document.write("<font color=red size=3> liczba jest parzysta</font>"+"<br>"); 
                if(a_dana_kur%2!=0) 
                      document.write("<font color=silver size=5> liczba jest nieparzysta</font>"+"<br>"); 
                  </script> 
 </div> 
 </body> 
</html>
