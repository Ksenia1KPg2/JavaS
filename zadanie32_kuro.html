<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body bgcolor="silver">

<div style="color:green; font-size:47px;">
<script type="text/javascript">

function samochod(marka, model, kolor, rok)
{
    this.marka = marka;
    this.model = model;
    this.kolor = kolor;
    this.rok = rok;
}

samochod.prototype.wypisz = function()
{
    alert(this.marka + " " + this.model + " " + this.kolor + " " + this.rok);
};

// Trzy obiekty
var samochod1 = new samochod("BMW", "M3", "czarny", 2020);
var samochod2 = new samochod("Audi", "A4", "biały", 2019);
var samochod3 = new samochod("Mercedes", "C", "srebrny", 2022);

// Dodatkowa właściwość poza konstruktorem
samochod1.nazwisko = "Kurowska";
samochod2.nazwisko = "Kurowska";
samochod3.nazwisko = "Kurowska";

// Dodatkowa metoda poza konstruktorem
samochod.prototype.samochod_pokaz_kurowska = function()
{
    document.write("Nazwisko ucznia: " + this.nazwisko + "<br>");
};

// Przyciski do wyświetlania danych
function pokazDane()
{
    document.write("Moje nazwisko to KUROWSKA<br>");
    document.write("Dostęp do pól trzech obiektów:<br><br>");

    document.write("Samochód 1: " + samochod1.marka + " " + samochod1.model + " " + samochod1.kolor + " " + samochod1.rok + "<br>");
    document.write("Samochód 2: " + samochod2.marka + " " + samochod2.model + " " + samochod2.kolor + " " + samochod2.rok + "<br>");
    document.write("Samochód 3: " + samochod3.marka + " " + samochod3.model + " " + samochod3.kolor + " " + samochod3.rok + "<br><br>");

    samochod1.samochod_pokaz_kurowska();
    samochod2.samochod_pokaz_kurowska();
    samochod3.samochod_pokaz_kurowska();
}

</script>
</div>

<div style="color:blue; font-size:41px;">
<br>
Programowanie obiektowe:<br>
Słowo kluczowe prototype stosowane jest do:<br>
dodawania metod do konstruktora.<br><br>

Słowo kluczowe new stosowane jest do:<br>
tworzenia nowych obiektów na podstawie konstruktora.
</div>

<br>

<button onclick="pokazDane()">Pokaż dane obiektów</button>
<button onclick="samochod1.wypisz()">Obiekt 1</button>
<button onclick="samochod2.wypisz()">Obiekt 2</button>
<button onclick="samochod3.wypisz()">Obiekt 3</button>

</body>
</html>
